x-watch-common: &watch-common
  action: sync
  path: ./server/packages/common
  target: /app/server/packages/common
  ignore:
    - node_modules/

services:
  api-gateway:
    profiles: ["server", "all"]
    build:
      context: .
      dockerfile: ./server/services/api-gateway/Dockerfile
      target: dev
    env_file:
      - ./server/.env
      - ./server/services/api-gateway/src/config/.env
    ports:
      - "3001:3001"
    develop:
      watch:
        - *watch-common
        - action: sync
          path: ./server/services/api-gateway/src
          target: /app/server/services/api-gateway/src
        - action: rebuild
          path: ./server/services/api-gateway/package.json
    networks:
      - anime-hub-network
    depends_on:
      - redis
  user-service:
    profiles: ["server", "all"]
    build:
      context: .
      dockerfile: ./server/services/user-service/Dockerfile
      target: dev
    env_file:
      - ./server/.env
      - ./server/services/user-service/src/config/.env
    ports:
      - "3002:3002"
    develop:
      watch:
        - *watch-common
        - action: sync
          path: ./server/services/user-service/src
          target: /app/server/services/user-service/src
        - action: rebuild
          path: ./server/services/user-service/package.json
    networks:
      - anime-hub-network
  redis:
    image: redis:trixie
    profiles: ["server", "all"]
    restart: always
    ports:
      - "6379:6379"
    # command: redis-server --save 20 1 --loglevel warning --requirepass AnimeHub
    environment:
      - SKIP_FIX_PERMS=1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./config/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - anime-hub-network
  client:
    profiles: ["client", "all"]
    build:
      context: .
      dockerfile: ./client/Dockerfile
      target: dev
    ports:
      - "8100:8100"
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
          ignore:
            - client/node_modules/
            - client/www
            - client/.angular
        - action: rebuild
          path: client/package.json
    networks:
      - anime-hub-network
networks:
  anime-hub-network:
    driver: bridge
volumes:
  redis_data:
