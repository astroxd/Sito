<div class="anime-card">
  <div class="anime-card-image">
    <a [routerLink]="['/anime', anime().id]">
      <img src="{{ anime().coverImage?.large }}" alt="{{ anime().title }}" />
      <div class="anime-card-image-overlay episodes">
        {{ getEpisodes(anime().status,
        anime().nextAiringEpisode,anime().episodes)}}
      </div>
      <div class="anime-card-image-overlay view">
        <!-- <fa-icon [icon]="faEye"></fa-icon> -->
        {{ anime().popularity.toLocaleString('en-US') }}
      </div>
    </a>
  </div>
  <div class="anime-card-text">
    <ul>
      @if (anime().genres) { @for (genre of anime().genres; track $index) {
      <li>
        <a href="">{{ genre }}</a>
      </li>
      } }
    </ul>
    <h5>
      <!-- <a> -->
      <a [routerLink]="['/anime', anime().id]">
        {{ anime().title.english ?? anime().title.romaji ?? 'No Title' }}
      </a>
    </h5>
  </div>
</div>
