<button class="primary-btn" id="open-modal" (click)="openModal()">
  Add Anime
</button>
<ion-modal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title class="ion-text-center">Choose Animes</ion-title>
        <ion-buttons slot="end">
          <ion-button disabled style="opacity: 0">HIDDEN</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-item>
        <ion-input
          label="Enter Anime Name"
          labelPlacement="stacked"
          type="text"
          placeholder="My Hero Academia"
          [(ngModel)]="name"
          (input)="onSearch($event)"
        ></ion-input>
      </ion-item>

      <ion-list>
        @for (anime of searchedAnime(); track $index) {
          @let isAlreadyAdded = sharedListAnimeIds().has(anime.id);
          <ion-item>
            <ion-thumbnail slot="start">
              <img [src]="anime.coverImage.large" />
            </ion-thumbnail>
            <ion-label>{{
              anime.title.english || anime.title.romaji
            }}</ion-label>
            <ion-button
              slot="end"
              [fill]="isAlreadyAdded ? 'outline' : 'solid'"
              [disabled]="isAlreadyAdded"
              (click)="addToSharedList(anime)"
              >{{ isAlreadyAdded ? "Added" : "Add" }}</ion-button
            >
          </ion-item>
        }
      </ion-list>
      <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
        <ion-infinite-scroll-content></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </ion-content>
  </ng-template>
</ion-modal>
