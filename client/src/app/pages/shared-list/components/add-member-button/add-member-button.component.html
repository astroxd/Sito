<button class="primary-btn" id="open-modal" (click)="openModal()">
  Add Member
</button>
<ion-modal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (click)="cancel()">Cancel</ion-button>
        </ion-buttons>
        <ion-title class="ion-text-center">Search users</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-item>
        <ion-input
          label="Enter your name"
          labelPlacement="stacked"
          type="text"
          placeholder="Your name"
          [(ngModel)]="name"
          (input)="onSearch($event)"
        ></ion-input>
      </ion-item>

      <ion-list>
        @for (friend of searchedFriends(); track $index) {
          <!-- @let relation = friendsAndPendingMap().get(user.userId); -->
          <ion-item>
            <ion-avatar slot="start" style="margin-right: 8px">
              <img [src]="friend.friendAvatar" [alt]="friend.friendUsername" />
            </ion-avatar>
            <ion-label>{{ friend.friendUsername }}</ion-label>
            <div slot="end">
              @if (sharedListMembers().has(friend.friendUserId)) {
                <ion-button color="success" disabled>
                  <!-- <ion-icon name="checkmark-done-outline" slot="start"></ion-icon> -->
                  Already in
                </ion-button>
              } @else if (sharedListInvited().has(friend.friendUserId)) {
                <ion-button color="warning" disabled>
                  <!-- <ion-icon name="time-outline" slot="start"></ion-icon> -->
                  Invited
                </ion-button>
              } @else {
                <ion-button
                  color="primary"
                  (click)="invite(friend.friendUserId)"
                >
                  <!-- <ion-icon name="mail-open-outline" slot="start"></ion-icon> -->
                  Invite
                </ion-button>
              }
              <!-- @if (relation) {
                @if (relation.status === "ACCEPTED") {
                  <ion-button color="success" fill="outline" disabled>
                    Friends
                  </ion-button>
                } @else if (relation.status === "PENDING") {
                  @if (relation.isIncoming) {
                    <ion-button
                      color="success"
                      fill="clear"
                      (click)="acceptFriendRequest(user.userId)"
                      >Accept
                    </ion-button>
                    <ion-button
                      color="danger"
                      fill="clear"
                      (click)="declineFriendRequest(user.userId)"
                      >Decline
                    </ion-button>
                  } @else {
                    <ion-button color="warning" fill="clear" disabled>
                      Sent
                    </ion-button>
                  }
                }
              } @else {
                <ion-button
                  color="primary"
                  (click)="sendFriendRequest(user.userId)"
                >
                  Add
                </ion-button>
              } -->
            </div>
          </ion-item>
        }
      </ion-list>
      <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
        <ion-infinite-scroll-content></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </ion-content>
  </ng-template>
</ion-modal>
