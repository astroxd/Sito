<ion-content class="ion-padding">
  <div class="section-header page-header">
    <div class="section-title">
      <h4>{{listInfo()?.name}}</h4>
    </div>
  </div>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="8">
        <div class="leader-message-container widget">
          <div class="leader-message-header">
            <span>Leader Message</span>
            <button class="primary-btn" (click)="focusOnInput(messageInput)">
              <fa-icon [icon]="faEdit"></fa-icon>
            </button>
          </div>
          <div class="leader-message-content">
            <input
              #messageInput
              type="text"
              name="message"
              [(ngModel)]="newMessage"
              (blur)="updateMessage()"
              (keydown.enter)="updateMessage()"
              [disabled]="!isLeader()"
              maxlength="255"
            />
          </div>
          <div
            class="list-actions"
            [style]="!isOwner() && !isEditor() ? 'display: none;' : ''"
          >
            <div class="action">
              @if (isOwner()) {

              <app-add-member-button />
              }
            </div>
            @if (isOwner() || isEditor()) {

            <div class="editor-buttons">
              <app-add-anime-button />
            </div>
            }
          </div>
        </div>
        <div class="section-header">
          <div class="section-title">
            <h5>Next Episodes</h5>
          </div>
        </div>
        <app-next-episodes />
        <app-animes-progress />
      </ion-col>
      <ion-col size="12" size-md="4">
        <app-leaderboard />
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
