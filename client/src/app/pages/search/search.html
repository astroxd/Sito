<section class="search-page">
  <app-search-bar
    [(searchOptions)]="options"
    [(sort)]="sortOption"
    [(page)]="page"
    [(queryParamOptions)]="paramOptions"
  />
  <app-search-results
    [anime]="anime | async"
    [query]="queryOptions().options.search"
    [(sort)]="sortOption"
    [(page)]="page"
  />
</section>
