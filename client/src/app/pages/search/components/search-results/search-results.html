<section class="search-result" style="margin-top: '40px'; margin-bottom: '60px;'">
  <div class="container">
    <div class="row">
      <div class="col">
        <div class="section-header">
          <div class="section-title">
            <h4>Results</h4>
          </div>
          <div class="order-by">
            <span>Order by:</span>
            <select name="sort"></select>
          </div>
          <span class="search-query"> Search for &quot;{{ 'ciao' }}&quot; </span>
          <div class="inline-pagination"></div>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top: '20px'">
      @if (anime() && anime()?.length) {
        @for (a of anime(); track $index) {
          <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6">
            <app-anime-card [anime]="a" />
          </div>
        }
      } @else {
        <div style="width: '100%'; text-align: 'center'; color: 'var(--text-secondary)'">
          No Results
        </div>
      }
      <!-- {loading ? (
						<Loader />
					) : animes.length > 0 ? (
						animes.map((anime, idx) => (
							<Col xl={3} lg={4} md={6} sm={6} key={idx}>
								<AnimeCard {...anime} />
							</Col>
						))
					) : (
						<div
							style={{
								width: '100%',
								textAlign: 'center',
								color: 'var(--text-secondary)',
							}}
						>
							No Results
						</div>
					)} -->
    </div>
  </div>
</section>
