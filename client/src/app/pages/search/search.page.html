<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-margin-start">Search</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Search</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <app-search-bar
      [(searchOptions)]="searchOptions"
      [(sort)]="sortOption"
      [(page)]="page"
      [(queryParamOptions)]="paramOptions"
    />
    <app-search-results
      [searchResults]="searchResults()"
      [query]="queryOptions().searchOptions?.search"
      [(sort)]="sortOption"
      [(page)]="page"
      [isLoading]="isLoading()"
    />
  </ion-grid>
  <!-- </section> -->
</ion-content>
