<ion-content [fullscreen]="true">
  <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header> -->
  <section style="margin-top: 1rem">
    <div
      style="background-image: url(../../../assets/images/banner.jpg)"
      class="auth"
    >
      <div>
        <h2>Login</h2>
      </div>
    </div>
    <section style="padding-top: 130px; padding-bottom: 150px">
      <ion-grid>
        <ion-row>
          <ion-col
            size="12"
            size-md="6"
            style="display: flex; justify-content: flex-end"
          >
            <div class="auth-form login-form">
              <h3>Login</h3>

              <form
                [formGroup]="loginFormControl.loginForm"
                (ngSubmit)="onSubmit()"
              >
                <p>{{loginError()}}</p>
                <div class="input-item">
                  <input
                    type="email"
                    placeholder="Email address"
                    formControlName="email"
                    required
                  />
                  <!-- <FontAwesomeIcon
											icon={faEnvelope}
											class='input-item-icon'
										/> -->
                  <p>{{formErrors().email}}</p>
                </div>

                <div class="input-item">
                  <input
                    type="text"
                    placeholder="Password"
                    formControlName="password"
                    required
                  />
                  <!-- <FontAwesomeIcon
											icon={faLock}
											class='input-item-icon'
										/> -->
                  <p>{{formErrors().password}}</p>
                </div>

                <button
                  type="submit"
                  [disabled]="!loginFormControl.loginForm.valid"
                  class="primary-btn"
                >
                  Login Now
                </button>
              </form>
              <a class="forgot-pass"> Forgot Your Password? </a>
            </div>
          </ion-col>
          <ion-col size="12" size-md="6">
            <div class="login-register">
              <h3>Don't Have an Account?</h3>
              <a routerLink="/register" replaceUrl="true" class="primary-btn">
                Register Now
              </a>
              <button (click)="TestAuth()">Test</button>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>
  </section>
</ion-content>
