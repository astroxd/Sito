<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>WatchList</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">WatchList</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <app-list [status]="1" name="Watching" />
    <app-list [status]="2" name="Completed" />
    <app-list [status]="3" name="Dropped" />
  </ion-grid>
</ion-content>
