<div class="list">
  <ion-row>
    <ion-col>
      <div class="section-header">
        <div class="section-title">
          <h4>{{ name() }}</h4>
        </div>
        <div class="section-search">
          <input
            type="search"
            placeholder="Search Anime"
            (input)="onSearch($event)"
          />
        </div>
      </div>
    </ion-col>
  </ion-row>
  <ion-row>
    @for (anime of listedAnimes(); track $index) {
      <ion-col size-xs="6" size-md="4" size-lg="2">
        <app-anime-card [listedAnime]="anime" />
      </ion-col>
    }
    @if (listedAnimesInfo().hasNextPage) {
      <div class="show-more">
        <span (click)="searchAnimes('', listedAnimesInfo().page + 1)"
          >Show More</span
        >
      </div>
    }

    @if (listedAnimes().length <= 0) {
      <div class="no-results">No Results</div>
    }
  </ion-row>
</div>
