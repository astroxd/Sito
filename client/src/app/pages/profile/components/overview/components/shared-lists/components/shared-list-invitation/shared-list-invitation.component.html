<div class="widget">
  <span class="widget-title">{{ invitation().sharedList.sharedListName }}</span>
  <span class="widget-subtitle">Group Members</span>
  <div class="avatar-container">
    @for (member of invitation().members; track $index) {
      <img [src]="member.avatarUrl" [alt]="member.username" />
    }
    @if (invitation().sharedListMembersNumber > 3) {
      <div class="stacked-avatar">
        +{{ invitation().sharedListMembersNumber - 3 }}
      </div>
    }
  </div>
  <div class="inviter-info">
    <img
      [src]="invitation().senderInfo.senderAvatarUrl"
      [alt]="invitation().senderInfo.senderUsername"
    />
    <span class="widget-subtitle"
      >{{ invitation().senderInfo.senderUsername }} ti ha invitato</span
    >
  </div>
  <div class="actions">
    <ion-button (click)="accept()">Accept</ion-button>
    <ion-button fill="outline" (click)="decline()">Decline</ion-button>
  </div>
</div>
