<div class="widget">
  <span class="widget-title">{{ invitation().sharedList.sharedListName }}</span>
  <span class="widget-subtitle">Group Members</span>
  <div class="avatar-container">
    @for (member of invitation().members; track $index) {
      <img
        src="https://static.vecteezy.com/system/resources/thumbnails/032/176/191/small/business-avatar-profile-black-icon-man-of-user-symbol-in-trendy-flat-style-isolated-on-male-profile-people-diverse-face-for-social-network-or-web-vector.jpg"
        alt=""
      />
    }
    <!-- @if (sharedList().sharedListMembersNumber > 3) {
      <div class="stacked-avatar">
        +{{ sharedList().sharedListMembersNumber - 3 }}
      </div>
    } -->
  </div>
  <span class="widget-subtitle"
    >{{ invitation().sharedList.senderUsername }} ti ha invitato</span
  >
  <div class="actions">
    <button class="primary-btn" (click)="accept()">Accetta</button>
    <button class="primary-btn" (click)="decline()">Rifiuta</button>
  </div>
</div>
