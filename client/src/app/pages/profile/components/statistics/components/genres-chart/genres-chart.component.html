<div class="widget">
  <div class="section-header">
    <div class="section-title">
      <h4>Your Genres</h4>
    </div>
  </div>
  <div class="chart-wrapper">
    @if (genres() !== null) {
      <canvas
        baseChart
        [data]="chartData()"
        [options]="radarChartOptions"
        type="radar"
      >
      </canvas>
    } @else {
      <ion-spinner />
    }
  </div>
</div>
