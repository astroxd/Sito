<div class="widget">
  <div class="section-header">
    <div class="section-title">
      <h4>Your Week</h4>
    </div>
  </div>
  <div class="chart-wrapper">
    @if (dailyHistory()) {
      <canvas
        baseChart
        [data]="chartData()"
        [options]="lineChartOptions"
        type="line"
      >
      </canvas>
    } @else {
      <ion-spinner />
    }
  </div>
</div>
